<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA Admin</title>
<style>
body{margin:0;background:#09090b;color:#f4f4f5;font-family:system-ui,sans-serif}
main{max-width:900px;margin:40px auto;padding:24px}
.card{background:#18181b;border:1px solid #27272a;border-radius:16px;padding:20px;margin-top:16px}
input,button,textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #3f3f46;background:#09090b;color:#fff;margin-top:8px}
button{cursor:pointer;background:#27272a}
#status{white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>🤖 NOVA Admin v2</h1>
<p>Mode aman — hanya AI chat. Katalog, TMDB, player, dan Google Sheet tidak disentuh.</p>
<div class="card">
<label>Admin Key</label>
<input id="key" type="password" autocomplete="off">
<label>Pesan</label>
<textarea id="message" rows="5" placeholder="Contoh: Jelaskan fungsi NOVA..."></textarea>
<button id="send">Kirim ke NOVA</button>
<button id="catalog" style="margin-top:8px">🔎 Cek Katalog (Read-Only)</button>
<button id="analyze" style="margin-top:8px">🤖 Analisis Katalog (Preview)</button>
<button id="actions" style="margin-top:8px">🧪 Buat Daftar Perbaikan (Preview)</button>
<div id="catalogResult" class="card" style="display:none;margin-top:12px"></div>
<div id="analysisResult" class="card" style="display:none;margin-top:12px"></div>
<div id="actionsResult" class="card" style="display:none;margin-top:12px"></div>
<div id="status"></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
$('send').onclick=async()=>{
 const key=$('key').value.trim(), message=$('message').value.trim();
 if(!key||!message){$('status').textContent='Isi Admin Key dan pesan.';return}
 $('send').disabled=true;$('status').textContent='Memproses...';
 try{
  const r=await fetch('/api/nova-chat',{method:'POST',headers:{'Content-Type':'application/json','x-nova-key':key},body:JSON.stringify({message})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||'Request gagal');
  $('status').textContent=data.reply||JSON.stringify(data,null,2);
 }catch(e){$('status').textContent='Error: '+e.message}
 finally{$('send').disabled=false}
};
$('catalog').onclick=async()=>{const box=$('catalogResult');box.style.display='block';box.textContent='Membaca katalog...';try{const r=await fetch('/api/nova-catalog');const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Katalog gagal dibaca');const s=d.stats||{};box.textContent='Katalog berhasil dibaca (READ-ONLY)\\n\\nTotal: '+s.total+'\\nJudul terisi: '+s.withTitle+'\\nDuplikat judul: '+s.duplicates+'\\nFilm: '+(s.movies??'tidak terdeteksi')+'\\nSeries: '+(s.series??'tidak terdeteksi')+'\\n\\nTidak ada data yang diubah.';}catch(e){box.textContent='Error: '+e.message}};
$('analyze').onclick=async()=>{const key=$('key').value.trim(),box=$('analysisResult');if(!key){box.style.display='block';box.textContent='Isi Admin Key terlebih dahulu.';return}box.style.display='block';box.textContent='NOVA sedang menganalisis katalog (READ-ONLY)...';try{const r=await fetch('/api/nova-catalog-analyze',{method:'POST',headers:{'x-nova-key':key}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Analisis gagal');box.textContent=d.analysis||'Tidak ada hasil analisis.';}catch(e){box.textContent='Error: '+e.message}};
$('actions').onclick=async()=>{const key=$('key').value.trim(),box=$('actionsResult');if(!key){box.style.display='block';box.textContent='Isi Admin Key terlebih dahulu.';return}box.style.display='block';box.textContent='Menyusun daftar perbaikan (PREVIEW)...';try{const r=await fetch('/api/nova-catalog-actions',{method:'POST',headers:{'x-nova-key':key}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Preview gagal');box.textContent=d.preview||'Tidak ada tindakan yang terdeteksi.';}catch(e){box.textContent='Error: '+e.message}};
</script>
</body>
</html>
