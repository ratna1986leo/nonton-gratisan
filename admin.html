<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Admin Dashboard — NontonGratisan</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#09090b;color:#f4f4f5;font-family:Inter,system-ui,sans-serif}.card{background:#121217;border:1px solid #27272a}</style>
</head>
<body>
<div class="max-w-7xl mx-auto px-4 py-6">
<header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6"><div><p class="text-xs text-zinc-500">NontonGratisan</p><h1 class="text-3xl font-extrabold">📊 Admin Dashboard</h1><p id="updated" class="text-xs text-zinc-500 mt-1">Memuat katalog...</p></div><div class="flex gap-2"><button id="refresh" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-sm font-bold">↻ Refresh</button><button id="export" class="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-sm">⇩ Export CSV</button><a href="/" class="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-sm">← Situs</a></div></header>
<div id="error" class="hidden mb-5 rounded-xl border border-red-900/60 bg-red-950/30 p-4 text-sm text-red-300"></div>
<div class="card rounded-2xl p-4 mb-5"><div class="grid md:grid-cols-3 gap-3"><input id="search" type="search" placeholder="Cari judul, genre, tahun..." class="rounded-xl bg-zinc-950 border border-zinc-800 px-4 py-3 text-sm"><select id="type" class="rounded-xl bg-zinc-950 border border-zinc-800 px-4 py-3 text-sm"><option value="all">Semua</option><option value="movie">Film</option><option value="tv">Series</option></select><select id="playerFilter" class="rounded-xl bg-zinc-950 border border-zinc-800 px-4 py-3 text-sm"><option value="all">Player: semua</option><option value="yes">Punya player</option><option value="no">Tanpa player</option></select></div></div>
<div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5"><div class="card rounded-2xl p-4"><div class="text-xs text-zinc-500">Total Katalog</div><div id="total" class="text-3xl font-extrabold mt-1">—</div></div><div class="card rounded-2xl p-4"><div class="text-xs text-zinc-500">Film</div><div id="films" class="text-3xl font-extrabold mt-1">—</div></div><div class="card rounded-2xl p-4"><div class="text-xs text-zinc-500">Series</div><div id="series" class="text-3xl font-extrabold mt-1">—</div></div><div class="card rounded-2xl p-4"><div class="text-xs text-zinc-500">Punya Player</div><div id="hasplayer" class="text-3xl font-extrabold mt-1 text-emerald-400">—</div></div><div class="card rounded-2xl p-4"><div class="text-xs text-zinc-500">Tanpa Player</div><div id="noplayer" class="text-3xl font-extrabold mt-1 text-amber-400">—</div></div></div>
<div class="card rounded-2xl p-4"><div class="flex items-center justify-between mb-4"><h2 class="font-bold">📋 Katalog</h2><span id="info" class="text-xs text-zinc-500"></span></div><div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-zinc-500 border-b border-zinc-800"><th class="p-2">Judul</th><th class="p-2">Tahun</th><th class="p-2">Genre</th><th class="p-2">Tipe</th><th class="p-2">Player</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/1yRbeSYw0PdbM_tZmjjgKd3v41B7yMMQNa-GTesgp3Lk/gviz/tq?tqx=out:csv&gid=0';
const $=id=>document.getElementById(id);let allItems=[],visibleItems=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++;}else q=!q;}else if(c===','&&!q){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c}if(cell||row.length){row.push(cell);if(row.some(v=>v.trim()))rows.push(row)}if(!rows.length)return[];const h=rows.shift().map(v=>v.trim().replace(/^\uFEFF/,'').toLowerCase());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??'').trim()])))}
function title(x){return x.judul||x.title||x.name||'Tanpa Judul'}
function series(x){const t=((x.tipe||x.type||x.jenis||'')+' '+title(x)+' '+(x.genre||'')).toLowerCase();return /series|tv|serial|drakor|k-drama|episode|season/.test(t)}
function player(x){return String(x.link||x.player||x.url||'').trim()}
function hasPlayer(x){return /^https?:\/\//i.test(player(x))}
function apply(){const q=$('search').value.trim().toLowerCase(),t=$('type').value,p=$('playerFilter').value;visibleItems=allItems.filter(x=>{const s=(title(x)+' '+(x.genre||'')+' '+(x.tahun||x.year||'')).toLowerCase();if(q&&!s.includes(q))return false;if(t==='movie'&&series(x))return false;if(t==='tv'&&!series(x))return false;if(p==='yes'&&!hasPlayer(x))return false;if(p==='no'&&hasPlayer(x))return false;return true});render()}
function render(){const films=visibleItems.filter(x=>!series(x)).length,s=visibleItems.length-films,p=visibleItems.filter(hasPlayer).length;$('total').textContent=visibleItems.length.toLocaleString('id-ID');$('films').textContent=films.toLocaleString('id-ID');$('series').textContent=s.toLocaleString('id-ID');$('hasplayer').textContent=p.toLocaleString('id-ID');$('noplayer').textContent=(visibleItems.length-p).toLocaleString('id-ID');$('info').textContent=`Menampilkan ${visibleItems.length.toLocaleString('id-ID')} dari ${allItems.length.toLocaleString('id-ID')} item`;$('rows').innerHTML=visibleItems.slice(0,1000).map(x=>`<tr class="border-b border-zinc-900"><td class="p-2 font-semibold">${esc(title(x))}</td><td class="p-2">${esc(x.tahun||x.year||'')}</td><td class="p-2">${esc(x.genre||'')}</td><td class="p-2">${series(x)?'Series':'Film'}</td><td class="p-2">${hasPlayer(x)?'<span class="text-emerald-400">✓ Ada</span>':'<span class="text-amber-400">— Tidak ada</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="p-6 text-center text-zinc-500">Tidak ada data.</td></tr>'}
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[['Judul','Tahun','Genre','Tipe','Player']].concat(visibleItems.map(x=>[title(x),x.tahun||x.year||'',x.genre||'',series(x)?'Series':'Film',player(x)]));const blob=new Blob([rows.map(r=>r.map(csvEscape).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nontongratisan-katalog-admin.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function load(){const b=$('refresh');b.disabled=true;b.textContent='Memuat...';$('error').classList.add('hidden');try{const r=await fetch(CSV_URL,{cache:'no-store'});if(!r.ok)throw Error('Google Sheets HTTP '+r.status);const text=await r.text();if(!text.trim()||/^\s*</.test(text))throw Error('Respons bukan CSV');const items=parseCSV(text);if(!items.length)throw Error('CSV kosong');allItems=items;apply();$('updated').textContent=`Katalog online • ${items.length.toLocaleString('id-ID')} item • ${new Date().toLocaleTimeString('id-ID')}`;}catch(e){$('error').textContent='Katalog gagal dimuat: '+e.message;$('error').classList.remove('hidden');}finally{b.disabled=false;b.textContent='↻ Refresh'}}
$('refresh').onclick=load;$('export').onclick=exportCSV;$('search').oninput=apply;$('type').onchange=apply;$('playerFilter').onchange=apply;load();
</script></body></html>
