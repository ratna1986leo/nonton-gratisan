<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>NOVA — Safe Admin</title>
<style>body{font-family:system-ui;background:#09090b;color:#f4f4f5;margin:0;padding:32px}.card{max-width:720px;margin:auto;background:#18181b;border:1px solid #27272a;border-radius:18px;padding:24px}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}#out{margin-top:18px;padding:14px;background:#09090b;border-radius:10px;white-space:pre-wrap}</style></head>
<body><main class="card"><div style="font-size:13px;color:#a1a1aa">NontonGratisan</div><h1>🤖 NOVA Safe Admin</h1><p style="color:#a1a1aa">Tahap pertama: NOVA dipisahkan dari katalog dan player. Halaman ini tidak membaca atau mengubah data film.</p><button id="btn">Cek NOVA</button><div id="out">Belum dicek.</div></main>
<script>btn.onclick=async()=>{out.textContent='Mengecek...';try{const r=await fetch('/api/nova-ping');const j=await r.json();out.textContent=JSON.stringify(j,null,2)}catch(e){out.textContent='NOVA belum aktif: '+e.message}}</script></body></html>
