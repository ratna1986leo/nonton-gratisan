name: Integrate Phase 1 UX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Phase 1 module
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          tag = '<script src="/phase1-ux.js" defer></script>'
          if tag not in h:
              marker = '</body>'
              if marker not in h:
                  raise SystemExit('Marker </body> tidak ditemukan')
              h = h.replace(marker, '    ' + tag + '\n' + marker, 1)
          p.write_text(h, encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Integrate Phase 1 UX"
          git push
