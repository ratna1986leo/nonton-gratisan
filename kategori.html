<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Kategori - NontonGratisan</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>body{margin:0;background:#07111f;color:#e8f1ff;font-family:Arial,sans-serif;line-height:1.7}main{max-width:900px;margin:40px auto;padding:24px}a{color:#55c8ff}h1{color:#6ee7ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{display:block;background:#0d1b2d;border:1px solid #17304b;border-radius:14px;padding:16px;text-decoration:none;color:#e8f1ff}.card:hover{border-color:#55c8ff}.muted{color:#91a4ba}</style></head><body><main><h1 id="title">Kategori</h1><p id="desc" class="muted">Memuat kategori...</p><div class="grid" id="list"></div><p><a href="/">← Kembali ke NontonGratisan</a></p></main><script>(function(){const categories={action:'Action',horror:'Horror',comedy:'Comedy',thriller:'Thriller',drama:'Drama',romance:'Romance','sci-fi':'Sci-Fi',animation:'Animation','series-korea':'Series Korea','series-barat':'Series Barat','series-indonesia':'Series Indonesia'};const params=new URLSearchParams(location.search);const slug=(params.get('slug')||'').toLowerCase();const name=categories[slug]||'Semua Kategori';document.title=name+' - NontonGratisan';document.getElementById('title').textContent=name;document.getElementById('desc').textContent=categories[slug]?'Pilihan tontonan untuk kategori '+name+'.':'Pilih kategori untuk melihat koleksi yang tersedia.';const list=document.getElementById('list');Object.entries(categories).forEach(([key,label])=>{const a=document.createElement('a');a.className='card';a.href='/kategori.html?slug='+encodeURIComponent(key);a.textContent=label;if(key===slug)a.style.borderColor='#55c8ff';list.appendChild(a)});})();</script></body></html>
