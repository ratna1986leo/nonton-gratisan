<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Kategori - NontonGratisan</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8f1ff;font-family:Arial,sans-serif;line-height:1.6}main{max-width:1180px;margin:0 auto;padding:28px 18px 50px}a{color:#55c8ff}h1{margin:0 0 6px;color:#6ee7ff;font-size:clamp(28px,5vw,42px)}.muted{color:#91a4ba}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.back{display:inline-block;text-decoration:none;background:#0d1b2d;border:1px solid #17304b;padding:10px 14px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.movie{overflow:hidden;background:#0d1b2d;border:1px solid #17304b;border-radius:14px;text-decoration:none;color:#e8f1ff;transition:.2s}.movie:hover{transform:translateY(-3px);border-color:#55c8ff}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#122238;display:block}.info{padding:11px}.title{font-weight:700;line-height:1.35}.year{font-size:13px;color:#91a4ba;margin-top:4px}.loading{padding:28px;text-align:center;background:#0d1b2d;border:1px solid #17304b;border-radius:14px}.pager{display:flex;justify-content:center;gap:10px;margin-top:24px}.pager button{background:#0d1b2d;color:#e8f1ff;border:1px solid #245070;border-radius:10px;padding:10px 16px;cursor:pointer}.pager button:disabled{opacity:.45;cursor:not-allowed}.cats{display:flex;gap:8px;overflow:auto;padding:2px 0 18px}.cats a{white-space:nowrap;text-decoration:none;background:#0d1b2d;border:1px solid #17304b;padding:8px 12px;border-radius:999px}.cats a.active{border-color:#55c8ff;color:#6ee7ff}
</style>
</head>
<body>
<main>
<div class="top"><div><h1 id="title">Kategori</h1><div id="desc" class="muted">Memuat film...</div></div><a class="back" href="/">← NontonGratisan</a></div>
<nav class="cats" id="cats"></nav>
<div id="status" class="loading">Memuat film...</div>
<div class="grid" id="list"></div>
<div class="pager"><button id="prev">← Sebelumnya</button><span id="pageInfo" class="muted" style="padding:10px">Halaman 1</span><button id="next">Berikutnya →</button></div>
</main>
<script>
(function(){
const API_KEY='e9a425d9a95b19ceecf5f763491a16a2';
const IMG='https://image.tmdb.org/t/p/w500';
const categories={action:{name:'Action',type:'movie',genre:28},horror:{name:'Horror',type:'movie',genre:27},comedy:{name:'Comedy',type:'movie',genre:35},thriller:{name:'Thriller',type:'movie',genre:53},drama:{name:'Drama',type:'movie',genre:18},romance:{name:'Romance',type:'movie',genre:10749},'sci-fi':{name:'Sci-Fi',type:'movie',genre:878},animation:{name:'Animation',type:'movie',genre:16},'series-korea':{name:'Series Korea',type:'tv',country:'KR'},'series-barat':{name:'Series Barat',type:'tv',country:'US|GB|CA|AU'},'series-indonesia':{name:'Series Indonesia',type:'tv',country:'ID'}};
const params=new URLSearchParams(location.search);const slug=(params.get('slug')||'').toLowerCase();const cfg=categories[slug]||categories.action;let page=1,totalPages=1;
const title=document.getElementById('title'),desc=document.getElementById('desc'),list=document.getElementById('list'),status=document.getElementById('status'),prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo'),cats=document.getElementById('cats');
document.title=cfg.name+' - NontonGratisan';title.textContent=cfg.name;desc.textContent=cfg.type==='movie'?'Film TMDB sesuai genre '+cfg.name+'.':'Serial TV TMDB dari '+cfg.name.replace('Series ','')+'.';
Object.entries(categories).forEach(([key,item])=>{const a=document.createElement('a');a.href='/kategori.php?slug='+encodeURIComponent(key);a.textContent=item.name;if(key===slug)a.className='active';cats.appendChild(a)});
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function render(items){list.innerHTML='';items.forEach(m=>{const a=document.createElement('a');a.className='movie';const media=cfg.type==='tv'?'tv':'movie';a.href='/'+media+'/'+m.id;const poster=m.poster_path?IMG+m.poster_path:'';a.innerHTML='<img class="poster" src="'+(poster||'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=')+'" alt="'+esc(m.title||m.name)+'" loading="lazy"><div class="info"><div class="title">'+esc(m.title||m.name)+'</div><div class="year">'+((m.release_date||m.first_air_date||'').slice(0,4)||'—')+'</div></div>';list.appendChild(a)})}
async function load(){status.style.display='block';status.textContent='Memuat film...';list.innerHTML='';try{let url;if(cfg.type==='movie'){url='https://api.themoviedb.org/3/discover/movie?api_key='+API_KEY+'&language=id-ID&sort_by=popularity.desc&include_adult=false&with_genres='+cfg.genre+'&page='+page}else{url='https://api.themoviedb.org/3/discover/tv?api_key='+API_KEY+'&language=id-ID&sort_by=popularity.desc&include_adult=false&with_origin_country='+encodeURIComponent(cfg.country)+'&page='+page}const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('TMDB '+r.status);const data=await r.json();const items=(data.results||[]).filter(x=>x.poster_path);totalPages=Math.min(Number(data.total_pages)||1,500);render(items);status.style.display=items.length?'none':'block';if(!items.length)status.textContent='Belum ada tontonan yang ditemukan.';pageInfo.textContent='Halaman '+page+' dari '+totalPages;prev.disabled=page<=1;next.disabled=page>=totalPages;window.scrollTo({top:0,behavior:'smooth'})}catch(e){status.style.display='block';status.textContent='Gagal memuat katalog. Coba refresh lagi.';prev.disabled=page<=1;next.disabled=true;console.error(e)}}
prev.onclick=()=>{if(page>1){page--;load()}};next.onclick=()=>{if(page<totalPages){page++;load()}};load();
})();
</script>
</body>
</html>
