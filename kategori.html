<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Kategori - NontonGratisan</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8f1ff;font-family:Arial,sans-serif;line-height:1.6}main{max-width:1180px;margin:auto;padding:28px 18px 50px}a{color:#55c8ff}h1{margin:0 0 6px;color:#6ee7ff;font-size:clamp(28px,5vw,42px)}.muted{color:#91a4ba}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.back{display:inline-block;text-decoration:none;background:#0d1b2d;border:1px solid #17304b;padding:10px 14px;border-radius:10px}.cats{display:flex;gap:8px;overflow:auto;padding:2px 0 18px}.cats a{white-space:nowrap;text-decoration:none;background:#0d1b2d;border:1px solid #17304b;padding:8px 12px;border-radius:999px}.cats a.active{border-color:#55c8ff;color:#6ee7ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(min-width:900px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}.movie{overflow:hidden;background:#0d1b2d;border:1px solid #17304b;border-radius:14px;text-decoration:none;color:#e8f1ff;transition:.2s}.movie:hover{transform:translateY(-3px);border-color:#55c8ff}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#122238}.info{padding:10px}.title{font-weight:700;line-height:1.35}.year{font-size:13px;color:#91a4ba;margin-top:4px}.source{font-size:10px;color:#6ee7ff;margin-top:5px}.status{padding:28px;text-align:center;background:#0d1b2d;border:1px solid #17304b;border-radius:14px}.pager{display:flex;justify-content:center;gap:10px;margin-top:24px}.pager button{background:#0d1b2d;color:#e8f1ff;border:1px solid #245070;border-radius:10px;padding:10px 16px;cursor:pointer}.pager button:disabled{opacity:.45;cursor:not-allowed}</style></head><body><main><div class="top"><div><h1 id="title">Kategori</h1><div id="desc" class="muted">Memuat tontonan...</div></div><a class="back" href="/">← NontonGratisan</a></div><nav class="cats" id="cats"></nav><div id="status" class="status">Memuat TMDB + Pustaka Film...</div><div class="grid" id="list"></div><div class="pager"><button id="prev">← Sebelumnya</button><span id="pageInfo" class="muted" style="padding:10px">Halaman 1</span><button id="next">Berikutnya →</button></div></main><script>(function(){
const API_KEY='e9a425d9a95b19ceecf5f763491a16a2';
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTdLZAQVdfGSSB2qO076v43C7Gxwe0WWLYG46pELaAYgOeM30fGPQWFJBHdla_FSmN4ki_v3yqG3OvN/pub?output=csv';
const IMG='https://image.tmdb.org/t/p/w500/';
const categories={action:{name:'Action',type:'movie',genre:28,terms:['action']},horror:{name:'Horror',type:'movie',genre:27,terms:['horror']},comedy:{name:'Comedy',type:'movie',genre:35,terms:['comedy','komedi']},thriller:{name:'Thriller',type:'movie',genre:53,terms:['thriller']},drama:{name:'Drama',type:'movie',genre:18,terms:['drama']},romance:{name:'Romance',type:'movie',genre:10749,terms:['romance']},'sci-fi':{name:'Sci-Fi',type:'movie',genre:878,terms:['sci-fi','sci fi','science fiction']},animation:{name:'Animation',type:'movie',genre:16,terms:['animation','animasi']},'series-korea':{name:'Series Korea',type:'tv',terms:['series korea','drakor','k-drama','drama korea','korea']},'series-barat':{name:'Series Barat',type:'tv',terms:['series barat','tv barat','barat','western']},'series-indonesia':{name:'Series Indonesia',type:'tv',terms:['series indonesia','tv indonesia','indonesia']}};
const params=new URLSearchParams(location.search);const slug=(params.get('slug')||'').toLowerCase();const cfg=categories[slug]||categories.action;let page=1,totalPages=1,allItems=[];
const title=document.getElementById('title'),desc=document.getElementById('desc'),list=document.getElementById('list'),status=document.getElementById('status'),prev=document.getElementById('prev'),next=document.getElementById('next'),pageInfo=document.getElementById('pageInfo'),cats=document.getElementById('cats');
document.title=cfg.name+' - NontonGratisan';title.textContent=cfg.name;desc.textContent='TMDB + Pustaka Film untuk kategori '+cfg.name+'.';
Object.entries(categories).forEach(([key,item])=>{const a=document.createElement('a');a.href='/kategori.php?slug='+encodeURIComponent(key);a.textContent=item.name;if(key===slug)a.className='active';cats.appendChild(a)});
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function normTitle(s){return String(s||'').toLowerCase().replace(/^nonton\s*/,'').replace(/sub\s*indo(?:nesia)?/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h)}
function isSeries(x){const t=String(x.Judul||'').toLowerCase(),g=String(x.Genre||'').toLowerCase(),typ=String(x.Tipe||x.Type||x.Jenis||'').toLowerCase();return ['series','tv','serial','drama korea','drakor'].some(k=>typ.includes(k))||['series','tv series','tv-series','drakor','drama korea','series korea','series asia','series indonesia','series barat','series india','tv korea','tv asia','tv indonesia','tv barat','tv india'].some(k=>g.includes(k))||/\b(?:season|series|episode|ep)\s*\d*/i.test(t)||/\bbag(?:ian)?\s*\d+\b/i.test(t)||/\[\s*\d{1,3}\s*\]/.test(t)}
function epNo(t){const m=String(t||'').match(/(?:season|episode|ep|bag(?:ian)?)\s*(?:ke\s*)?(\d+)/i);return m?Number(m[1]):1}
function parseCSV(text){const rows=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);v='';if(row.some(x=>String(x).trim()))rows.push(row);row=[]}else v+=c}row.push(v);if(row.some(x=>String(x).trim()))rows.push(row);if(rows.length<2)return[];const h=rows[0].map(x=>String(x).trim().replace(/^\uFEFF/,''));return rows.slice(1).filter(r=>r.length===h.length).map(r=>{const o={};h.forEach((k,i)=>o[k]=String(r[i]??'').trim());return o})}
function libraryMatches(data){const seen=new Set();return data.filter(x=>{const g=String(x.Genre||'').toLowerCase(),series=isSeries(x);if(cfg.type==='tv'&&!series)return false;if(cfg.type==='movie'&&series)return false;if(!cfg.terms.some(t=>g.includes(t)))return false;if(series&&epNo(x.Judul)>1)return false;const key=normTitle(x.Judul)+'-'+String(x.Tahun||'');if(seen.has(key))return false;seen.add(key);return true}).reverse().map(x=>({id:hashCode(String(x.Judul||'')+String(x.Link||'')),title:String(x.Judul||'Tanpa Judul').replace(/^Nonton\s*/i,'').replace(/Sub\s*Indo(?:nesia)?/gi,'').replace(/\[\d+\]/g,'').replace(/\b(?:Episode|Ep|Bag(?:ian)?)\s*\d+\b/gi,'').trim()||String(x.Judul||'Tanpa Judul'),year:String(x.Tahun||'—'),poster:String(x.Poster||''),type:cfg.type,source:'Pustaka'}))}
function render(){const start=(page-1)*24,end=start+24;list.innerHTML='';allItems.slice(start,end).forEach(m=>{const a=document.createElement('a');a.className='movie';a.href='/'+m.type+'/'+m.id+'/'+encodeURIComponent(m.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''));const p=m.poster||'';a.innerHTML='<img class="poster" src="'+esc(p||'https://placehold.co/400x600/122238/6ee7ff?text=No+Poster')+'" alt="'+esc(m.title)+'" loading="lazy"><div class="info"><div class="title">'+esc(m.title)+'</div><div class="year">'+esc(m.year)+'</div><div class="source">'+esc(m.source)+'</div></div>';list.appendChild(a)})
 totalPages=Math.max(1,Math.ceil(allItems.length/24));pageInfo.textContent='Halaman '+page+' dari '+totalPages;prev.disabled=page<=1;next.disabled=page>=totalPages;status.style.display=allItems.length?'none':'block';if(!allItems.length)status.textContent='Belum ada tontonan untuk kategori ini.'}
async function load(){status.style.display='block';status.textContent='Memuat TMDB + Pustaka Film...';try{let url=cfg.type==='movie'?'https://api.themoviedb.org/3/discover/movie?api_key='+API_KEY+'&language=id-ID&sort_by=popularity.desc&include_adult=false&with_genres='+cfg.genre+'&page=1':'https://api.themoviedb.org/3/discover/tv?api_key='+API_KEY+'&language=id-ID&sort_by=popularity.desc&include_adult=false&page=1';const r=await fetch(url);const d=await r.json();let tmdb=(d.results||[]).filter(x=>x.poster_path).map(x=>({id:x.id,title:x.title||x.name,year:(x.release_date||x.first_air_date||'').slice(0,4)||'—',poster:IMG+x.poster_path,type:cfg.type,source:'TMDB',origin:(x.origin_country||[]).join('|')}));if(cfg.type==='tv'){if(slug==='series-korea')tmdb=tmdb.filter(x=>x.origin.includes('KR'));else if(slug==='series-indonesia')tmdb=tmdb.filter(x=>x.origin.includes('ID'));else if(slug==='series-barat')tmdb=tmdb.filter(x=>['US','GB','CA','AU'].some(c=>x.origin.includes(c)))}let lib=[];try{const cr=await fetch(CSV_URL);if(cr.ok)lib=libraryMatches(parseCSV(await cr.text()))}catch(e){}const seen=new Set(tmdb.map(x=>normTitle(x.title)+'-'+x.year));lib=lib.filter(x=>{const k=normTitle(x.title)+'-'+x.year;if(seen.has(k))return false;seen.add(k);return true});allItems=[...tmdb,...lib];render()}catch(e){console.error(e);try{const cr=await fetch(CSV_URL);allItems=libraryMatches(parseCSV(await cr.text()));render()}catch(e2){status.textContent='Gagal memuat katalog. Coba refresh lagi.';status.style.display='block'}}}
prev.onclick=()=>{if(page>1){page--;render();window.scrollTo({top:0,behavior:'smooth'})}};next.onclick=()=>{if(page<totalPages){page++;render();window.scrollTo({top:0,behavior:'smooth'})}};load();})();</script></body></html>
